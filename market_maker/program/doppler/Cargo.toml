[package]
name = "doppler"
description = "Vendored from https://github.com/blueshift-gg/doppler (sources unchanged)."
repository = "https://github.com/blueshift-gg/doppler"
license = "MIT"
edition = "2021"
version = "0.1.0"

[features]
default = []
std = []

[dependencies]
pinocchio = { version = "0.11.1", default-features = false, features = ["copy"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
   'cfg(target_os, values("solana"))',
] }
