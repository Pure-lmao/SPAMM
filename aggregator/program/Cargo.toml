[package]
name = "spamm_aggregator"
version = "0.0.1"
edition = "2021"
license = "CC-BY-NC-4.0"
description = ""
autotests = false

[package.metadata.solana]
tools-version = "v1.53"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["bpf-entrypoint"]
# Disable when consuming this crate as a library (avoids duplicate entrypoint symbols).
bpf-entrypoint = []
# Enables `pinocchio_log::log!` call sites gated by `#[cfg(feature = "log")]`.
log = []
# Mollusk SBF integration tests (`program/tests/*`). Requires `app_specific_delegated_vaults.so` in `target/deploy/`.
test-sbf = ["log"]

[dependencies]
pinocchio = { version = "0.11.1", default-features = false, features = ["cpi", "copy", "account-resize"] }
pinocchio-associated-token-account = "0.4.0"
pinocchio-system = "0.6.0"
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.0"
pinocchio-log = { version = "0.5.1", default-features = false, features = ["macro"] }
solana-address = { version = "2.4.0", features = ["curve25519"] }
solana-define-syscall = { version = "5.0", features = ["unstable-static-syscalls"] }
zeropod = { version = "0.3.2", features = ["solana-address"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
   'cfg(target_os, values("solana"))',
   'cfg(target_arch, values("bpf", "sbf"))',
] }
[[test]]
name = "spamm_mollusk"
path = "tests/spamm_mollusk/main.rs"
required-features = ["test-sbf"]

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeropod = { version = "0.3.2", features = ["solana-address"] }
mollusk-svm = "0.12.1-agave.4"
mollusk-svm-programs-token = "0.12.1-agave.4"
solana-account = "=3.4.0"
solana-instruction = "3.2"
solana-instructions-sysvar = "3.0"
solana-program-error = "3.0"
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-pubkey = { version = "4.0", features = ["curve25519"] }
solana-rent = "3.0"
solana-sdk-ids = "3.1"
spl-associated-token-account-interface = "2.0"
spl-token-interface = "2.0"

[profile.release]
debug = 1
