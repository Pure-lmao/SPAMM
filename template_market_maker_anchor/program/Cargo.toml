[package]
name = "spamm_template_market_maker_anchor"
version = "0.0.1"
edition = "2021"
license = "CC-BY-NC-4.0"
description = "Anchor template SPAMM."
autotests = false

[lib]
crate-type = ["cdylib", "lib"]
name = "spamm_template_market_maker_anchor"

[features]
default = ["bpf-entrypoint", "no-idl"]
bpf-entrypoint = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
pinocchio = { version = "0.11.1", default-features = false, features = ["copy"] }
solana-sdk-ids = "2"
spamm_aggregator = { path = "../../aggregator/program", default-features = false }
zeropod = { version = "0.3.4", features = ["solana-address"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
   'cfg(target_os, values("solana"))',
   'cfg(feature, values("custom-heap", "custom-panic"))',
] }
